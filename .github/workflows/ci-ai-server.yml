name: 🟣 AI Server CI — FastAPI

on:
  push:
    branches: [main, develop, 'codex/**']
    paths:
      - "ai-server/**"
      - ".github/workflows/ci-ai-server.yml"
  pull_request:
    branches: [main]
    paths:
      - "ai-server/**"

jobs:
  lint-and-test:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-server/requirements.txt

      - name: Install dependencies (CPU-only torch for CI speed)
        working-directory: ai-server
        run: |
          pip install --upgrade pip
          pip install torch==2.4.1+cpu torchvision==0.19.1+cpu \
            --index-url https://download.pytorch.org/whl/cpu
          pip install fastapi uvicorn pydantic pydantic-settings \
            python-multipart structlog ruff pytest pytest-asyncio httpx pillow opencv-python-headless \
            requests scipy scikit-learn openpyxl==3.1.5

      - name: Preview safety tests
        working-directory: ai-server
        run: python -m unittest discover -s tests -v

      - name: Ruff lint
        working-directory: ai-server
        run: ruff check . --select E,F,W --ignore E501

      - name: Syntax check all modules
        working-directory: ai-server
        run: |
          python -c "
          import ast, sys
          files = [
            'main.py','config.py',
            'routers/anemia.py','routers/skin.py','routers/posture.py',
            'routers/eye.py','routers/wound.py','routers/tongue.py',
            'utils/image_utils.py','utils/response_utils.py','utils/auth_utils.py'
          ]
          errors = []
          for f in files:
            try:
              ast.parse(open(f, encoding='utf-8').read())
              print(f'OK: {f}')
            except SyntaxError as e:
              errors.append(str(e))
          if errors:
            print('ERRORS:', errors)
            sys.exit(1)
          print('All syntax OK')
          "

      - name: Import check (FastAPI app loads without errors)
        working-directory: ai-server
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from config import get_settings
          s = get_settings()
          print(f'Config OK: {s.app_name} v{s.app_version}')
          from utils.response_utils import build_response, DetectionResponse
          print('Utils OK')
          print('All imports verified')
          "
        env:
          AI_API_KEY: ci-test-key

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mediscan-ai:${{ github.sha }} ./ai-server

      - name: Verify image starts
        run: |
          docker run -d --name test-ai \
            -e AI_API_KEY=test-key \
            mediscan-ai:${{ github.sha }}
          sleep 10
          docker logs test-ai | head -20
          docker rm -f test-ai
