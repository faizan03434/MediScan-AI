name: 🔐 Security Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"  # Every Monday at 2 AM UTC

jobs:
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET NuGet vulnerability scan
        working-directory: backend
        run: dotnet list package --vulnerable --include-transitive 2>&1 | tee nuget-audit.txt
        continue-on-error: true

      - name: Node.js npm audit
        working-directory: apps/mobile
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Python pip-audit
        working-directory: ai-server
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln GHSA-34jh-p97f-mpxf
        continue-on-error: true

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp, python

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build for CodeQL (.NET)
        working-directory: backend
        run: dotnet build MediScan.sln -c Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
